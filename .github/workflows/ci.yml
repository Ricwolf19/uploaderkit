name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo
        with:
          cache: true

      # One step on purpose: `verify:ci` is the single definition of what green
      # means, and .husky/pre-push runs the very same script. Spelling the
      # checks out again here is how CI and the hook drift apart.
      - name: Verify
        run: pnpm verify:ci
